id = "shin1ohno.hide-sdk-panes"
name = "Hide SDK panes"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Hide Claude remote-control (claude rc, --sdk-url) panes from the Agents view"
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "hide_sdk_panes.py", "sweep"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "hide_sdk_panes.py", "sweep"]

[[events]]
on = "pane.created"
command = ["python3", "hide_sdk_panes.py", "sweep"]
